services:
  postgres:
    image: postgres:15
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    volumes:
      - ./redis:/data
    ports:
      - "6379:6379"
    networks:
      - saas_network

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: saas_evolution
    restart: always
    environment:
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URL:?EVOLUTION_DATABASE_URL is required}
      - DATABASE_URL=${EVOLUTION_DATABASE_URL:?EVOLUTION_DATABASE_URL is required}
      - DATABASE_SAVE_IS_ON_WHATSAPP=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - INSTANCE_NAME=evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
    volumes:
      - ./evolution:/app/instances
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - saas_network

  n8n:
    image: n8nio/n8n:latest
    container_name: saas_n8n
    restart: always
    environment:
      - N8N_DATABASE_TYPE=postgresdb
      - N8N_DATABASE_POSTGRESDB_HOST=postgres
      - N8N_DATABASE_POSTGRESDB_DATABASE=${POSTGRES_DB:-saas}
      - N8N_DATABASE_POSTGRESDB_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - N8N_DATABASE_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./n8n:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      - postgres
      - redis
    networks:
      - saas_network

  nextjs:
    build:
      context: ../dashboard-saas
      dockerfile: Dockerfile
    container_name: saas_nextjs
    restart: always
    environment:
      - DATABASE_URL=${SAAS_DATABASE_URL:?SAAS_DATABASE_URL is required}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - saas_network

networks:
  saas_network:
    driver: bridge
