name: CI — Testes Chatbot Nexus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vendassaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d vendassaas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/vendassaas_test
      NEXTAUTH_SECRET: ci-test-secret-with-at-least-32-chars
      NEXTAUTH_URL: http://localhost:3000
      EVOLUTION_API_KEY: ci_test_fake_key_for_tests_only

    defaults:
      run:
        working-directory: saas-docker/nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas-docker/nextjs/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Validar esquema Prisma (introspect pgvector)
        run: npx prisma validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes unitários + webhook (Vitest)
        run: npm test

      - name: Instalar browser Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npx playwright test
        env:
          NODE_ENV: development
