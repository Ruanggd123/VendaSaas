services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    volumes:
      - ./redis:/data
    ports:
      - "6379:6379"
    networks:
      - saas_network

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: saas_evolution
    restart: always
    environment:
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URL:?EVOLUTION_DATABASE_URL is required}
      - DATABASE_URL=${EVOLUTION_DATABASE_URL:?EVOLUTION_DATABASE_URL is required}
      # Avoid one concurrent Prisma query per contact during WhatsApp history sync.
      - DATABASE_SAVE_IS_ON_WHATSAPP=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URI=redis://redis:6379
      - REDIS_URL=redis://redis:6379
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - INSTANCE_NAME=evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      - REJECT_CALL=true
      - MSG_CALL_REJECTED=Desculpe, este número não recebe chamadas. Por favor, envie uma mensagem de texto.
      - SET_MESSAGES_AS_READ=false
      - READ_MESSAGES=false
    volumes:
      - ./evolution:/app/instances
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - saas_network

  nextjs:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
    container_name: saas_nextjs
    restart: always
    environment:
      - DATABASE_URL=${SAAS_DATABASE_URL:?SAAS_DATABASE_URL is required}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - ASAAS_API_KEY=${ASAAS_API_KEY:-}
      - ASAAS_API_URL=${ASAAS_API_URL:-https://sandbox.asaas.com/api/v3}
      # SMTP para envio de emails (recuperação de senha, notificações)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@seudominio.com}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - saas_network

  worker:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
    container_name: saas_worker
    restart: always
    command: npx tsx src/worker.ts
    environment:
      - IS_WORKER=true
      - DATABASE_URL=${SAAS_DATABASE_URL:?SAAS_DATABASE_URL is required}
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@seudominio.com}
    depends_on:
      - postgres
      - redis
    networks:
      - saas_network

  manager:
    build:
      context: ./evolution-manager
      dockerfile: Dockerfile
      args:
        - VITE_EVOLUTION_API_URL=http://localhost:3000/api/proxy/evolution
    container_name: saas_manager
    restart: always
    environment:
      - VITE_EVOLUTION_API_URL=http://localhost:3000/api/proxy/evolution
    volumes:
      - ./manager-nginx.conf:/etc/nginx/conf.d/nginx.conf
    ports:
      - "3001:80"
    networks:
      - saas_network

networks:
  saas_network:
    driver: bridge
