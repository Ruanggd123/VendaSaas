<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Nexus atendimento e vendas no WhatsApp</title>
  <desc id="desc">Automatize seu WhatsApp, atenda clientes e venda 24 horas por dia com inteligencia artificial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050817"/>
      <stop offset=".48" stop-color="#101747"/>
      <stop offset="1" stop-color="#062b31"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#43efff"/>
      <stop offset=".5" stop-color="#7775ff"/>
      <stop offset="1" stop-color="#d85eff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#76ffc2"/>
      <stop offset="1" stop-color="#16d67e"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#31eb98"/>
      <stop offset="1" stop-color="#0fbf72"/>
    </linearGradient>
    <radialGradient id="purpleGlow">
      <stop stop-color="#6960ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6960ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aquaGlow">
      <stop stop-color="#17e4bb" stop-opacity=".32"/>
      <stop offset="1" stop-color="#17e4bb" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#7a91ff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <circle cx="540" cy="180" r="530" fill="url(#purpleGlow)"/>
  <circle cx="920" cy="920" r="440" fill="url(#aquaGlow)"/>
  <path d="M-120 318C260 86 678 86 1210 340" fill="none" stroke="url(#brand)" stroke-opacity=".17" stroke-width="2"/>
  <path d="M-150 369C240 142 674 142 1220 395" fill="none" stroke="#56eaff" stroke-opacity=".08"/>

  <!-- Brand -->
  <g transform="translate(68 48)">
    <rect width="66" height="66" rx="20" fill="#0a1028" stroke="url(#brand)" stroke-width="2"/>
    <path d="M17 48V18l32 30V18" fill="none" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="84" y="31" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" letter-spacing="7">NEXUS</text>
    <text x="85" y="53" fill="#8d99ba" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="2">INTELIGÊNCIA QUE ATENDE E VENDE</text>
  </g>
  <g transform="translate(804 59)">
    <rect width="204" height="43" rx="22" fill="#17da85" fill-opacity=".12" stroke="#3deb9c" stroke-opacity=".45"/>
    <circle cx="24" cy="21.5" r="6" fill="#5dffb6" filter="url(#glow)"/>
    <text x="42" y="28" fill="#9affca" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">ATIVO 24 HORAS</text>
  </g>

  <!-- Headline -->
  <text x="68" y="212" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" letter-spacing="-2">SEU WHATSAPP PODE</text>
  <text x="68" y="282" fill="url(#green)" font-family="Arial, Helvetica, sans-serif" font-size="73" font-weight="900" letter-spacing="-3">VENDER POR VOCÊ.</text>
  <text x="70" y="330" fill="#b6bfd9" font-family="Arial, Helvetica, sans-serif" font-size="23">Enquanto você trabalha, dorme ou cuida do seu negócio.</text>

  <!-- Phone mockup -->
  <g transform="translate(68 384)" filter="url(#shadow)">
    <rect width="405" height="510" rx="45" fill="#070b15" stroke="#7782ff" stroke-opacity=".6" stroke-width="2"/>
    <rect x="14" y="14" width="377" height="482" rx="34" fill="#ece8df"/>
    <rect x="14" y="14" width="377" height="76" rx="34" fill="#075e54"/>
    <rect x="14" y="59" width="377" height="31" fill="#075e54"/>
    <circle cx="54" cy="52" r="23" fill="#e7fffa"/>
    <path d="M43 62V42l22 20V42" fill="none" stroke="#13a985" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="89" y="48" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Assistente Nexus</text>
    <text x="89" y="69" fill="#b8e5da" font-family="Arial, Helvetica, sans-serif" font-size="12">online agora</text>
    <circle cx="352" cy="52" r="3" fill="#fff"/><circle cx="352" cy="42" r="3" fill="#fff"/><circle cx="352" cy="62" r="3" fill="#fff"/>

    <g transform="translate(34 118)">
      <rect width="290" height="87" rx="16" fill="#fff"/>
      <text x="17" y="26" fill="#25322f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Olá! Como posso ajudar?</text>
      <text x="17" y="49" fill="#44524f" font-family="Arial, Helvetica, sans-serif" font-size="13">Posso mostrar produtos, agendar</text>
      <text x="17" y="68" fill="#44524f" font-family="Arial, Helvetica, sans-serif" font-size="13">um horário ou gerar seu PIX.</text>
    </g>
    <g transform="translate(50 220)">
      <rect width="305" height="48" rx="14" fill="#e1ffd6"/>
      <text x="18" y="30" fill="#284139" font-family="Arial, Helvetica, sans-serif" font-size="14">Quero conhecer os planos!</text>
      <text x="276" y="36" fill="#619083" font-family="Arial, Helvetica, sans-serif" font-size="10">10:42</text>
    </g>
    <g transform="translate(34 286)">
      <rect width="322" height="138" rx="16" fill="#fff"/>
      <text x="17" y="28" fill="#25322f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Perfeito! Escolha uma opção:</text>
      <rect x="16" y="44" width="290" height="34" rx="10" fill="#f2f5f4" stroke="#d6dfdc"/>
      <text x="161" y="66" text-anchor="middle" fill="#087c69" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">CONHECER PLANOS</text>
      <rect x="16" y="88" width="290" height="34" rx="10" fill="#087c69"/>
      <text x="161" y="110" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">FALAR COM CONSULTOR</text>
    </g>
    <rect x="29" y="447" width="347" height="34" rx="17" fill="#fff"/>
    <text x="49" y="469" fill="#9aa19f" font-family="Arial, Helvetica, sans-serif" font-size="12">Digite uma mensagem...</text>
    <circle cx="357" cy="464" r="13" fill="#16a37d"/>
    <path d="M351 464l5 5 8-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Benefits -->
  <g transform="translate(512 392)">
    <text x="0" y="26" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">NUNCA MAIS PERCA UMA VENDA</text>
    <text x="0" y="55" fill="#7f8bab" font-family="Arial, Helvetica, sans-serif" font-size="16">por demora no atendimento.</text>

    <g transform="translate(0 88)">
      <rect width="496" height="88" rx="22" fill="#111a39" stroke="#636fff" stroke-opacity=".25"/>
      <circle cx="45" cy="44" r="25" fill="#626aff" fill-opacity=".16"/>
      <path d="M34 43l8 8 15-19" fill="none" stroke="#8e96ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="37" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Respostas automáticas com IA</text>
      <text x="84" y="61" fill="#8e99b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Atendimento natural, rápido e personalizado.</text>
    </g>
    <g transform="translate(0 190)">
      <rect width="496" height="88" rx="22" fill="#0e211f" stroke="#25df8d" stroke-opacity=".26"/>
      <circle cx="45" cy="44" r="25" fill="#21df8c" fill-opacity=".13"/>
      <path d="M32 52h27M36 45h19M40 38h11" fill="none" stroke="#56efac" stroke-width="4" stroke-linecap="round"/>
      <text x="84" y="37" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Catálogo, agenda e PIX no chat</text>
      <text x="84" y="61" fill="#88af9f" font-family="Arial, Helvetica, sans-serif" font-size="14">Do primeiro “olá” até o pagamento.</text>
    </g>
    <g transform="translate(0 292)">
      <rect width="496" height="88" rx="22" fill="#111a39" stroke="#636fff" stroke-opacity=".25"/>
      <circle cx="45" cy="44" r="25" fill="#626aff" fill-opacity=".16"/>
      <path d="M31 52l9-11 8 7 12-17" fill="none" stroke="#8e96ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="37" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Painel completo de vendas</text>
      <text x="84" y="61" fill="#8e99b8" font-family="Arial, Helvetica, sans-serif" font-size="14">Conversas, clientes e resultados em um só lugar.</text>
    </g>
    <g transform="translate(0 394)">
      <rect width="496" height="88" rx="22" fill="#0e211f" stroke="#25df8d" stroke-opacity=".26"/>
      <circle cx="45" cy="44" r="25" fill="#21df8c" fill-opacity=".13"/>
      <path d="M34 34h22v22H34zM40 28v6M50 28v6" fill="none" stroke="#56efac" stroke-width="4" stroke-linecap="round"/>
      <text x="84" y="37" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Ativação rápida em até 24h</text>
      <text x="84" y="61" fill="#88af9f" font-family="Arial, Helvetica, sans-serif" font-size="14">Sua operação automatizada sem complicação.</text>
    </g>
  </g>

  <!-- Offer -->
  <g transform="translate(68 936)" filter="url(#shadow)">
    <rect width="940" height="184" rx="34" fill="#111936" stroke="#7580ff" stroke-opacity=".42"/>
    <circle cx="850" cy="48" r="180" fill="url(#purpleGlow)"/>
    <rect x="26" y="24" width="274" height="34" rx="17" fill="#ffbd3f"/>
    <text x="163" y="47" text-anchor="middle" fill="#3d2600" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900">OFERTA PARA O SEU NEGÓCIO</text>
    <text x="28" y="105" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900">Assine o atendimento e ganhe</text>
    <text x="28" y="150" fill="url(#green)" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="900">SEU SITE 100% GRÁTIS</text>
    <g transform="translate(756 46)">
      <rect width="140" height="94" rx="20" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".15"/>
      <rect x="18" y="16" width="104" height="60" rx="6" fill="none" stroke="#72f5ba" stroke-width="4"/>
      <path d="M18 31h104M50 85h40" fill="none" stroke="#72f5ba" stroke-width="4" stroke-linecap="round"/>
      <circle cx="29" cy="24" r="2.5" fill="#72f5ba"/><circle cx="38" cy="24" r="2.5" fill="#72f5ba"/>
    </g>
  </g>

  <!-- Price and CTA -->
  <g transform="translate(68 1150)">
    <text x="0" y="25" fill="#8793b2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">PLANOS A PARTIR DE</text>
    <text x="0" y="88" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900">R$ 97</text>
    <text x="178" y="88" fill="#8b97b7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">/mês</text>

    <g transform="translate(363 5)">
      <rect width="577" height="91" rx="28" fill="url(#cta)"/>
      <circle cx="51" cy="45.5" r="27" fill="#fff" fill-opacity=".18"/>
      <path d="M38 32c-13 13-6 35 11 39 8 2 16-1 22-7l-9-8c-3 3-7 4-11 3-7-2-10-10-6-16l-7-11z" fill="#fff"/>
      <text x="94" y="38" fill="#052c20" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">FALE AGORA COM UM CONSULTOR</text>
      <text x="94" y="68" fill="#04261c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900">(88) 98188-5499</text>
    </g>
  </g>

  <text x="68" y="1302" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">NEXUS</text>
  <text x="144" y="1302" fill="#65718f" font-family="Arial, Helvetica, sans-serif" font-size="16">| Tecnologia que atende. Tecnologia que vende.</text>
  <text x="68" y="1331" fill="#56617e" font-family="Arial, Helvetica, sans-serif" font-size="12">Consulte condições, recursos e limites de cada plano. Site incluso conforme o plano contratado.</text>
</svg>
