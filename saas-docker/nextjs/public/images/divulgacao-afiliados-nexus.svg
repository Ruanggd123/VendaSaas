<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Programa de Afiliados Nexus</title>
  <desc id="desc">Ganhe 50 por cento na primeira mensalidade e 30 por cento de recorrencia mensal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050817"/>
      <stop offset="0.52" stop-color="#10153a"/>
      <stop offset="1" stop-color="#07152b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38f4ff"/>
      <stop offset="0.48" stop-color="#7276ff"/>
      <stop offset="1" stop-color="#d25cff"/>
    </linearGradient>
    <linearGradient id="money" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9cffc1"/>
      <stop offset="1" stop-color="#13dc82"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff1a6"/>
      <stop offset="0.5" stop-color="#ffca55"/>
      <stop offset="1" stop-color="#ff8a34"/>
    </linearGradient>
    <radialGradient id="topGlow">
      <stop stop-color="#675cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#675cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop stop-color="#16e58d" stop-opacity=".34"/>
      <stop offset="1" stop-color="#16e58d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#88a1ff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <circle cx="580" cy="170" r="520" fill="url(#topGlow)"/>
  <circle cx="900" cy="960" r="400" fill="url(#greenGlow)"/>
  <path d="M-70 252C210 95 502 84 1150 284" fill="none" stroke="url(#brand)" stroke-opacity=".18" stroke-width="2"/>
  <path d="M-120 300C240 132 600 136 1200 350" fill="none" stroke="#5eeaff" stroke-opacity=".09" stroke-width="1"/>

  <!-- Brand -->
  <g transform="translate(72 56)">
    <rect width="66" height="66" rx="20" fill="#0b1029" stroke="url(#brand)" stroke-width="2"/>
    <path d="M17 48V18l32 30V18" fill="none" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="84" y="30" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="7">NEXUS</text>
    <text x="85" y="52" fill="#8f9bbb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="2.2">PROGRAMA DE AFILIADOS</text>
  </g>

  <g transform="translate(72 168)">
    <rect width="330" height="40" rx="20" fill="#7772ff" fill-opacity=".13" stroke="#8c8aff" stroke-opacity=".5"/>
    <circle cx="24" cy="20" r="6" fill="#54f3ff" filter="url(#glow)"/>
    <text x="43" y="26" fill="#d9ddff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">TRANSFORME INDICAÇÕES EM RENDA</text>
  </g>

  <!-- Main headline -->
  <text x="72" y="284" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">INDIQUE. VENDA.</text>
  <text x="72" y="358" fill="url(#money)" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="-3">GANHE TODO MÊS.</text>
  <text x="74" y="405" fill="#aeb7d3" font-family="Arial, Helvetica, sans-serif" font-size="24">Tecnologia que vende. Comissão que continua entrando.</text>

  <!-- Commission hero cards -->
  <g transform="translate(72 458)" filter="url(#softShadow)">
    <rect width="448" height="206" rx="30" fill="#111938" stroke="#596bff" stroke-opacity=".55"/>
    <rect x="1" y="1" width="446" height="204" rx="29" fill="url(#topGlow)" fill-opacity=".25"/>
    <text x="28" y="42" fill="#aeb8dc" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">NA PRIMEIRA MENSALIDADE</text>
    <text x="26" y="132" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="900">50%</text>
    <rect x="28" y="156" width="208" height="30" rx="15" fill="#6e70ff" fill-opacity=".18"/>
    <text x="45" y="177" fill="#bfc7ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">BÔNUS DE BOAS-VINDAS</text>
    <g transform="translate(340 68)">
      <circle cx="38" cy="38" r="38" fill="#7172ff" fill-opacity=".16" stroke="#8386ff" stroke-opacity=".5"/>
      <path d="M21 43l12 12 24-31" fill="none" stroke="#83f6ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(542 458)" filter="url(#softShadow)">
    <rect width="466" height="206" rx="30" fill="#0d241f" stroke="#27e790" stroke-opacity=".6"/>
    <circle cx="386" cy="28" r="126" fill="url(#greenGlow)"/>
    <text x="28" y="42" fill="#a6d9c2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">RECORRÊNCIA MENSAL</text>
    <text x="26" y="132" fill="url(#money)" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="900">+30%</text>
    <rect x="28" y="156" width="226" height="30" rx="15" fill="#21db84" fill-opacity=".13"/>
    <text x="45" y="177" fill="#84efbb" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">ENQUANTO O CLIENTE FICAR</text>
    <path d="M386 78c-25-24-65-7-65 26 0 41 65 72 65 72s65-31 65-72c0-33-40-50-65-26z" transform="scale(.62) translate(235 22)" fill="none" stroke="#6ff7ba" stroke-width="10"/>
  </g>

  <!-- Plan earnings -->
  <text x="72" y="729" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">QUANTO VOCÊ GANHA POR VENDA</text>
  <text x="1008" y="729" text-anchor="end" fill="#7884a7" font-family="Arial, Helvetica, sans-serif" font-size="15">1º MÊS  +  RECORRÊNCIA</text>

  <g transform="translate(72 758)">
    <rect width="936" height="94" rx="24" fill="#11172f" stroke="#ffffff" stroke-opacity=".09"/>
    <rect x="18" y="17" width="60" height="60" rx="18" fill="#41dff2" fill-opacity=".12"/>
    <path d="M35 60l12-14 10 8 12-20" fill="none" stroke="#54eaff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="40" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">PLANO SITE</text>
    <text x="100" y="67" fill="#8290b5" font-family="Arial, Helvetica, sans-serif" font-size="16">Mensalidade R$ 97</text>
    <text x="585" y="56" text-anchor="end" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">R$ 48,50</text>
    <text x="617" y="56" fill="#5d6889" font-family="Arial, Helvetica, sans-serif" font-size="24">+</text>
    <text x="895" y="56" text-anchor="end" fill="#56edaa" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">R$ 29,10/mês</text>
  </g>

  <g transform="translate(72 868)">
    <rect width="936" height="94" rx="24" fill="#151735" stroke="#8580ff" stroke-opacity=".3"/>
    <rect x="18" y="17" width="60" height="60" rx="18" fill="#817cff" fill-opacity=".15"/>
    <path d="M36 38h25v25H36zM42 31v7M55 31v7M42 63v7M55 63v7M29 44h7M29 57h7M61 44h7M61 57h7" fill="none" stroke="#9a96ff" stroke-width="4" stroke-linecap="round"/>
    <text x="100" y="40" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">PLANO CRM</text>
    <text x="100" y="67" fill="#8290b5" font-family="Arial, Helvetica, sans-serif" font-size="16">Mensalidade R$ 197</text>
    <text x="585" y="56" text-anchor="end" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">R$ 98,50</text>
    <text x="617" y="56" fill="#5d6889" font-family="Arial, Helvetica, sans-serif" font-size="24">+</text>
    <text x="895" y="56" text-anchor="end" fill="#56edaa" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">R$ 59,10/mês</text>
  </g>

  <g transform="translate(72 978)">
    <rect width="936" height="94" rx="24" fill="#17231e" stroke="#36e997" stroke-opacity=".38"/>
    <rect x="18" y="17" width="60" height="60" rx="18" fill="#2de58f" fill-opacity=".13"/>
    <path d="M32 42h32l-4 25H36zM38 42l5-12h10l5 12M40 52h16" fill="none" stroke="#5bf2ac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="40" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">PLANO LOJA</text>
    <text x="100" y="67" fill="#8290b5" font-family="Arial, Helvetica, sans-serif" font-size="16">Mensalidade R$ 397</text>
    <text x="585" y="56" text-anchor="end" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">R$ 198,50</text>
    <text x="617" y="56" fill="#5d6889" font-family="Arial, Helvetica, sans-serif" font-size="24">+</text>
    <text x="895" y="56" text-anchor="end" fill="#56edaa" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">R$ 119,10/mês</text>
  </g>

  <!-- Big scenario -->
  <g transform="translate(72 1110)" filter="url(#softShadow)">
    <rect width="936" height="148" rx="30" fill="url(#gold)"/>
    <circle cx="850" cy="40" r="150" fill="#fff" fill-opacity=".16"/>
    <text x="30" y="39" fill="#4f2a00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="1.2">EXEMPLO: 10 VENDAS DO PLANO LOJA</text>
    <text x="28" y="96" fill="#221300" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900">R$ 1.985 no 1º mês</text>
    <text x="31" y="126" fill="#603800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">+ R$ 1.191 por mês em comissões recorrentes</text>
    <g transform="translate(790 41)">
      <circle cx="38" cy="38" r="38" fill="#291800" fill-opacity=".9"/>
      <text x="38" y="52" text-anchor="middle" fill="#ffd86f" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900">$</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="72" y="1304" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">SEJA UM AFILIADO NEXUS</text>
  <text x="1008" y="1304" text-anchor="end" fill="#75f4b6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">VENDA TECNOLOGIA. CONSTRUA RECORRÊNCIA.</text>
  <text x="72" y="1331" fill="#637091" font-family="Arial, Helvetica, sans-serif" font-size="12">Valores ilustrativos conforme comissão padrão do programa. Consulte as condições vigentes.</text>
</svg>
